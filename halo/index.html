<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/public/assets/logo/safari/Logo-Box-Bright-2.ico" sizes="any">
    <link rel="apple-touch-icon" href="/public/assets/logo/Logo-Box-Bright-2@2x.jpg" sizes="any">
    <link rel="icon" href="/public/assets/logo/No-BG-Bright-1.svg" type="image/svg+xml">
    <link rel=”mask-icon” href="public/assets/logo/No-BG-Bright-1.svg" color="#d9d9d9" type="image/svg+xml">

    <title>→ Halo Edition</title>
    <meta name="description" content="'Halo Edition' is a project completed at Anti Studio, the subsidiary company of Services Généraux, a design studio based in Paris." />
    <meta name="keywords" content="3D rendering, 3D design, architectural visualization, interior design rendering, product visualization, CGI services, photorealistic rendering, animation, paris, paris france, services généraux." />

    <link rel="stylesheet" href="/public/style.css">

    <script defer src="/public/global.js"></script>
    <script defer src="/halo/video-controls.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>

<body>
    <nav id="navbar">
        <a href="/" class="nav-link" aria-label="Return to Homepage">Home</a>
        <a href="/" class="nav-link" aria-label="Return to Homepage">
            <img src="/public/assets/logo/No-BG-Bright-1.svg" alt="" class="nav-logo">
        </a>
        <a href="/about" class="nav-link" aria-label="Go to About page">About</a>
    </nav>

    <main>
        <!-- Hero -->
        <div class="header-container" id="resizeElement">
            <p class="header-text">Halo Edition</>
            <p class="header-text">Anti Studio</p>
            <p class="header-text">2023</p>
        </div>

        <!-- Info -->
        <div class="project-info-container">
            <p class="project-info" id="showCredits">Credits</p>
        </div>

        <!-- Modal -->
        <div class="modal" id="myModal">
            <span class="close-btn" id="closeModal">close</span>
            <div class="modal-content">
                <div class="modal-text-div">
                    <p class="modal-info">Execution</p>
                    <p class="modal-text">Anti Studio</p>
                </div>
            </div>
        </div>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <button class="close-btn" id="close-btn">close</button>
            <img src="" alt="Lightbox Image" class="lightbox-img" id="lightbox-img" draggable="false" loading="lazy">
            <div class="lightbox-controls">
                <button class="prev-btn" id="prev-btn">←</button>
                <p class="lightbox-count" id="lightbox-img-nr">[1/12]</p>
                <button class="next-btn" id="next-btn">→</button>
            </div>
        </div>

        <!-- Images & Videos -->
        <div class="image-container grid-two">

            <div class="video-container full-width">
                <video class="project-image project-video" src="/projects/halo-edition/assets/videos/HALO_EDITION_FILM_16-9.mp4" loop nocontrols playsinline muted autoplay poster="/projects/halo-edition/assets/images/HaloEdition_Stills_DP_Video-1_Poster_text_blur.webp"></video>
                <div class="video-controls-div">
                    <div class="video-buttons-container">
                        <button class="video-control-button play-pause-button">
                            <img class="video-control-icon pause" src="/public/assets/svg/utility/pause-fill-white.svg" alt="">
                            <img class="video-control-icon play" src="/public/assets/svg/utility/play-fill-white.svg" alt="">
                        </button>
                        <button class="video-control-button mute-button">
                            <img class="video-control-icon unmute" src="/public/assets/svg/utility/volume-mute-fill-white.svg" alt="">
                            <img class="video-control-icon mute" src="/public/assets/svg/utility/volume-up-fill-white.svg" alt="">
                        </button>
                    </div>
                    <div class="playback-container">
                        <div class="playback-bar"></div>
                    </div>
                </div>
            </div>

            <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/halo-edition/assets/images/HaloEdition_Stills_DP_2.webp" alt="" draggable="false" loading="lazy">
            <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/halo-edition/assets/images/HaloEdition_Stills_DP_1.webp" alt="" draggable="false" loading="lazy">
            <video class="project-image full-height" src="/projects/halo-edition/assets/videos/HALO_CUTDOWN_MAG_V002.mp4" loop nocontrols playsinline muted autoplay poster="/projects/halo-edition/assets/images/HaloEdition_Stills_DP_Video-2_Poster_text_blur.webp"></video>
            <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/halo-edition/assets/images/STILL_PACKSHOT_MAG_WHITE_2K.webp" alt="" draggable="false" loading="lazy">
        </div>
    </main>
</body>

</html>
