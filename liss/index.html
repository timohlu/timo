<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/public/assets/logo/safari/Logo-Box-Bright-2.ico" sizes="any">
    <link rel="apple-touch-icon" href="/public/assets/logo/Logo-Box-Bright-2@2x.jpg" sizes="any">
    <link rel="icon" href="/public/assets/logo/No-BG-Bright-1.svg" type="image/svg+xml">
    <link rel=”mask-icon” href="public/assets/logo/No-BG-Bright-1.svg" color="#d9d9d9" type="image/svg+xml">

    <title>→ Liss</title>
    <meta name="description" content="'Liss' is my graduation project from art school, images created by me and the texts written by a local author." />
    <meta name="keywords" content="3D rendering, 3D design, architectural visualization, interior design rendering, product visualization, CGI services, rendering." />

    <link rel="stylesheet" href="/public/style.css">

    <script defer src="/public/global.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</head>

<body>
    <nav id="navbar">
        <a href="/" class="nav-link" aria-label="Return to Homepage">Home</a>
        <a href="/" class="nav-link" aria-label="Return to Homepage">
            <img src="/public/assets/logo/No-BG-Bright-1.svg" alt="" class="nav-logo">
        </a>
        <a href="/about" class="nav-link" aria-label="Go to About page">About</a>
    </nav>

    <main>
        <!-- Hero -->
        <div class="header-container" id="resizeElement">
            <p class="header-text">Liss</p>
            <p class="header-text">Personal Work</p>
            <p class="header-text">2022</p>
        </div>

        <!-- Info -->
        <div class="project-info-container">
            <p class="project-info" id="showCredits">Credits</p>
        </div>

        <!-- Modal -->
        <div class="modal" id="myModal">
            <span class="close-btn" id="closeModal">close</span>
            <div class="modal-content">
                <div class="modal-text-div">
                    <p class="modal-info">Visuals & Idea</p>
                    <p class="modal-text">Timo</p>
                </div>
                <div class="modal-text-div">
                    <p class="modal-info">Texte</p>
                    <p class="modal-text">Lorenz Müller</p>
                </div>
            </div>
        </div>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <button class="close-btn" id="close-btn">close</button>
            <img src="" alt="Lightbox Image" class="lightbox-img" id="lightbox-img" draggable="false" loading="lazy">
            <div class="lightbox-controls">
                <button class="prev-btn" id="prev-btn">←</button>
                <p class="lightbox-count" id="lightbox-img-nr">[1/12]</p>
                <button class="next-btn" id="next-btn">→</button>
            </div>
        </div>

        <!-- Images -->
        <div class="image-container grid-two">
            <div class="liss-container">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Suite_HD_M_L_F_001.webp" alt draggable="false" loading="lazy">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Suite_HD_CU-1_L_F_001.webp" alt draggable="false" loading="lazy">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Suite_HD_CU-2_L_F_001.webp" alt draggable="false" loading="lazy">
                
            </div>
            <div class="liss-container">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Bath_HD_M_L_GH_F_001.webp" alt draggable="false" loading="lazy">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Bath_HD_CU-2_L_GH_F_001.webp" alt draggable="false" loading="lazy">
                <img class="project-image lightbox-trigger" id="lightbox-img" src="/projects/liss/assets/Bath_HD_CU-1_L_GH_F_001.webp" alt draggable="false" loading="lazy">
                
            </div>
        </div>

    </main>
</body>

</html>
